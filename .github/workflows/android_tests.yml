name: Android CI

on:
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Detekt and Ktlint
      run: ./gradlew detekt ktlintCheck

    - name: Run Unit Tests (desktop and Android host)
      run: ./gradlew test

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK (verify R8/minify)
      run: ./gradlew assembleRelease

    - name: Build Instrumented Test APKs
      run: >-
        ./gradlew assembleDebugAndroidTest
        :core:data:assembleAndroidDeviceTest
        :feature:settings:presentation:assembleAndroidDeviceTest
        :feature:history:presentation:assembleAndroidDeviceTest

    - name: Build Desktop App
      run: ./gradlew :desktopApp:build

  ios:
    name: iOS Build and Test
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Kotlin/Native toolchain
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Link Shared Framework (iOS simulator)
      run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

    - name: Run iOS Simulator Tests
      run: ./gradlew iosSimulatorArm64Test

    - name: Build iOS App (simulator, unsigned)
      run: >-
        xcodebuild
        -project iosApp/iosApp.xcodeproj
        -scheme iosApp
        -configuration Debug
        -sdk iphonesimulator
        -destination 'generic/platform=iOS Simulator'
        ARCHS=arm64
        CODE_SIGNING_ALLOWED=NO
        build
